<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  let token = sessionStorage.getItem('rayygmail_user_token') || '';
  let currentMode = 'login';
  const rupiah = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
  const dateText = value => { if (!value) return '-'; const d = new Date(value); return isNaN(d) ? '-' : d.toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'}); };
  const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function toast(message) { const el=$('toast'); el.textContent=message; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),3200); }
  function callServer(fn, ...args) { return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e && e.message ? e.message : 'Terjadi kesalahan server.')))[fn](...args)); }
  function setMessage(id, message, error=false) { const el=$(id); el.textContent=message; el.classList.toggle('error',!!error); }
  function showAuth(mode='login') { currentMode=mode; $('authPanel').classList.remove('hidden'); $('authPanel').scrollIntoView({behavior:'smooth',block:'center'}); updateAuthMode(); setMessage('authMessage',''); }
  function updateAuthMode() { const isReg=currentMode==='register'; $('authTitle').textContent=isReg?'Buat akun RAYYGMAIL':'Selamat datang kembali'; $('authSubtitle').textContent=isReg?'Daftar untuk mulai menggunakan dashboard.':'Masuk ke dashboard RAYYGMAIL.'; $('nameWrap').classList.toggle('hidden',!isReg); $('authName').required=isReg; $('authPassword').autocomplete=isReg?'new-password':'current-password'; $('authSubmit').textContent=isReg?'Buat akun →':'Masuk ke dashboard →'; document.querySelectorAll('.auth-tab').forEach(b=>b.classList.toggle('active',b.dataset.mode===currentMode)); }
  $('openLogin').addEventListener('click',()=>showAuth('login')); $('openRegister').addEventListener('click',()=>showAuth('register')); $('heroRegister').addEventListener('click',()=>showAuth('register')); $('bottomRegister').addEventListener('click',()=>showAuth('register')); $('closeAuth').addEventListener('click',()=>$('authPanel').classList.add('hidden')); document.querySelectorAll('.auth-tab').forEach(b=>b.addEventListener('click',()=>{currentMode=b.dataset.mode;updateAuthMode();setMessage('authMessage','');})); $('year').textContent=new Date().getFullYear();
  $('authForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('authSubmit');btn.disabled=true;btn.textContent='Memproses…';setMessage('authMessage','');try{const form={name:$('authName').value,email:$('authEmail').value,password:$('authPassword').value};const result=await callServer(currentMode==='register'?'registerUser':'loginUser',form);token=result.token;sessionStorage.setItem('rayygmail_user_token',token);$('authForm').reset();$('authPanel').classList.add('hidden');$('dashboard').classList.remove('hidden');await loadDashboard();toast(currentMode==='register'?'Akun berhasil dibuat.':'Berhasil masuk.');$('dashboard').scrollIntoView({behavior:'smooth'});}catch(err){setMessage('authMessage',err.message,true);}finally{btn.disabled=false;updateAuthMode();}});
  function statusBadge(status){const cls={'Pending':'pending','Disetujui':'disetujui','Ditolak':'ditolak','Selesai':'selesai','Aktif':'aktif','Nonaktif':'nonaktif'}[status]||'pending';return `<span class="status status-${cls}">${esc(status||'Pending')}</span>`;}
  async function loadDashboard(){if(!token)return;try{const data=await callServer('getUserDashboard',token);$('dashboard').classList.remove('hidden');$('userName').textContent=data.user.name;$('balanceValue').textContent=rupiah(data.user.balance);$('heroBalance').textContent=Number(data.user.balance||0).toLocaleString('id-ID');const submissions=data.submissions||[];$('submissionCount').textContent=submissions.length;$('approvedCount').textContent=submissions.filter(x=>x.status==='Disetujui').length;$('heroSubmissions').textContent=submissions.length;$('heroApproved').textContent=submissions.filter(x=>x.status==='Disetujui').length;
    $('submissionRows').innerHTML=submissions.length?submissions.map(x=>`<tr><td>${esc(dateText(x.createdAt))}</td><td>${esc(x.type)}</td><td>${esc(x.reference)}</td><td>${statusBadge(x.status)}</td><td>${esc(x.adminNote||'-')}</td></tr>`).join(''):'<tr><td colspan="5" class="empty-state">Belum ada pengajuan.</td></tr>';
    $('transactionRows').innerHTML=data.transactions.length?data.transactions.map(x=>`<tr><td>${esc(dateText(x.createdAt))}</td><td>${esc(x.type)}</td><td>${esc(x.description)}</td><td class="${Number(x.amount)<0?'danger-text':'green-text'}">${Number(x.amount)>0?'+':''}${esc(rupiah(x.amount))}</td><td>${statusBadge(x.status)}</td></tr>`).join(''):'<tr><td colspan="5" class="empty-state">Belum ada transaksi.</td></tr>';
    $('recentActivity').innerHTML=submissions.slice(0,5).map(x=>`<div class="activity-item"><span class="activity-icon">▤</span><div class="activity-body"><strong>${esc(x.type)} · ${esc(x.reference)}</strong><small>${esc(dateText(x.createdAt))}</small></div>${statusBadge(x.status)}</div>`).join('')||'<div class="empty-state">Belum ada aktivitas. Kirim pengajuan pertamamu.</div>';
  }catch(err){if(/Sesi berakhir|masuk kembali|Akun tidak aktif/i.test(err.message)){token='';sessionStorage.removeItem('rayygmail_user_token');$('dashboard').classList.add('hidden');toast('Sesi berakhir. Silakan masuk kembali.');}else toast(err.message);}}
  $('refreshUser').addEventListener('click',loadDashboard);
  $('logoutBtn').addEventListener('click',async()=>{try{if(token)await callServer('logout',token);}catch(_){}token='';sessionStorage.removeItem('rayygmail_user_token');$('dashboard').classList.add('hidden');showAuth('login');toast('Kamu sudah keluar.');});
  $('submissionForm').addEventListener('submit',async e=>{e.preventDefault();if(!token){showAuth('login');toast('Masuk terlebih dahulu.');return;}const btn=e.submitter;btn.disabled=true;setMessage('submissionMessage','Mengirim pengajuan…');try{const res=await callServer('createSubmission',token,{type:$('submissionType').value,reference:$('submissionReference').value,note:$('submissionNote').value});$('submissionForm').reset();setMessage('submissionMessage',res.message);toast(res.message);await loadDashboard();}catch(err){setMessage('submissionMessage',err.message,true);}finally{btn.disabled=false;}});
  if(token)loadDashboard();
})();
</script>
