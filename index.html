<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0b12">
  <title>RAYYGMAIL — Masuk</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>

  <header class="topbar">
    <a class="brand" href="/"><span class="brand-icon">✉</span>
      <span>RAYY<span class="accent">GMAIL</span><small>SUBMISSION PLATFORM</small></span>
    </a>
    <span class="secure-label">FRASH</span>
  </header>

  <main class="container">
    <section class="auth-screen">
      <div class="auth-intro">
        <div class="eyebrow"><span class="pulse"></span> RAYYGMAIL FRASH</div>
        <h1>Storan Gmail<br><span class="gradient-text">Dan Hasilkan Uang</span></h1>
        <p>Daftar Gratis Dan Mulai Bisnis Anda</p>
        <div class="trust-row">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>

      <div class="auth-card">
        <div class="brand auth-brand">
          <span class="brand-icon">✉</span>
          <span>RAYYGMAIL <span class="accent">STORAN</span></span>
        </div>

        <div class="auth-tabs">
          <button class="auth-tab active" data-mode="login" type="button">Masuk</button>
          <button class="auth-tab" data-mode="register" type="button">Daftar</button>
        </div>

        <form id="authForm">
          <label id="nameWrap" class="hidden">Nama lengkap
            <input id="authName" maxlength="80" autocomplete="name" placeholder="Nama kamu">
          </label>
          <label>Email
            <input id="authEmail" type="email" maxlength="150" autocomplete="email" required placeholder="anda@email.com">
          </label>
          <label>Kata sandi
            <input id="authPassword" type="password" minlength="8" maxlength="200" autocomplete="current-password" required placeholder="Minimal 8 karakter">
          </label>
          <p class="privacy-note">Gunakan kata sandi khusus akun ini. Jangan masukkan kata sandi Gmail, OTP, atau kode pemulihan.</p>
          <button class="btn btn-primary btn-wide" id="authSubmit" type="submit">Masuk →</button>
        </form>
        <p class="message" id="authMessage" role="status"></p>
      </div>
    </section>
  </main>

  <footer class="footer">© <span id="year"></span> RAYYGMAIL · Gunakan layanan dengan bijak.</footer>
  <script src="/app.js"></script>
</body>
</html>
