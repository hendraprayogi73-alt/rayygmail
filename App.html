<script>
let authMode = 'login';
let sessionToken = '';
const $ = id => document.getElementById(id);
$('year').textContent = new Date().getFullYear();

document.querySelectorAll('.auth-tab').forEach(btn => btn.addEventListener('click', () => setMode(btn.dataset.mode)));
function setMode(mode) {
  authMode = mode;
  document.querySelectorAll('.auth-tab').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  $('nameWrap').classList.toggle('hidden', mode !== 'register');
  $('authName').required = mode === 'register';
  $('authPassword').autocomplete = mode === 'register' ? 'new-password' : 'current-password';
  $('authSubmit').textContent = mode === 'register' ? 'Buat akun' : 'Masuk';
  $('authMessage').textContent = '';
}
function showError(el, err) { el.textContent = (err && err.message) ? err.message : String(err || 'Terjadi kesalahan.'); }
function serverCall(method, ...args) {
  return new Promise((resolve, reject) => {
    if (!google || !google.script || !google.script.run) return reject(new Error('Backend hanya bisa digunakan melalui URL Web App Google Apps Script.'));
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[method](...args);
  });
}
$('authForm').addEventListener('submit', async e => {
  e.preventDefault();
  const message = $('authMessage');
  message.textContent = 'Memproses...';
  $('authSubmit').disabled = true;
  try {
    const payload = {name:$('authName').value.trim(), email:$('authEmail').value.trim(), password:$('authPassword').value};
    const result = await serverCall(authMode === 'register' ? 'registerUser' : 'loginUser', payload);
    sessionToken = result.token;
    $('authPassword').value = '';
    $('authView').classList.add('hidden');
    $('dashboardView').classList.remove('hidden');
    await loadDashboard();
  } catch(err) { showError(message, err); }
  finally { $('authSubmit').disabled = false; }
});
async function loadDashboard() {
  try {
    const data = await serverCall('getUserDashboard', sessionToken);
    $('userName').textContent = data.user.name;
    $('balanceValue').textContent = money(data.user.balance);
    $('submissionCount').textContent = data.submissions.length;
    $('approvedCount').textContent = data.submissions.filter(x => x.status.toLowerCase() === 'disetujui').length;
    renderSubmissions(data.submissions);
    renderTransactions(data.transactions);
    const activity = $('recentActivity');
    activity.replaceChildren();
    if (!data.submissions.length) activity.innerHTML = '<div class="empty-state">Belum ada pengajuan.</div>';
    data.submissions.slice(0,5).forEach(item => {
      const div = document.createElement('div'); div.className = 'activity-item';
      const title = document.createElement('strong'); title.textContent = item.type + ' · ' + item.reference;
      const small = document.createElement('small'); small.textContent = item.date + ' · ';
      const status = document.createElement('span'); status.className = 'status ' + item.status.toLowerCase(); status.textContent = item.status;
      small.appendChild(status); div.append(title, small); activity.appendChild(div);
    });
  } catch(err) {
    showError($('submissionMessage'), err);
    if ((err.message || '').toLowerCase().includes('sesi')) logout();
  }
}
function renderSubmissions(rows) {
  const tbody = $('submissionRows'); tbody.replaceChildren();
  if (!rows.length) { tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Belum ada pengajuan.</td></tr>'; return; }
  rows.forEach(x => { const tr = document.createElement('tr'); [x.date,x.type,x.reference,x.status,x.adminNote || '-'].forEach((v,i)=>{const td=document.createElement('td');td.textContent=v; if(i===3){const s=document.createElement('span');s.className='status '+String(v).toLowerCase();s.textContent=v;td.replaceChildren(s);}tr.appendChild(td);});tbody.appendChild(tr); });
}
function renderTransactions(rows) {
  const tbody = $('transactionRows'); tbody.replaceChildren();
  if (!rows.length) { tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Belum ada transaksi.</td></tr>'; return; }
  rows.forEach(x => { const tr=document.createElement('tr'); [x.date,x.type,x.description,money(x.amount),x.status].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td);});tbody.appendChild(tr); });
}
function money(n) { return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0); }
$('submissionForm').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = $('submissionMessage'); msg.textContent = 'Mengirim...';
  const payload = {type:$('submissionType').value,reference:$('submissionReference').value.trim(),note:$('submissionNote').value.trim()};
  try {
    const result = await serverCall('submitRequest', sessionToken, payload);
    msg.textContent = result.message;
    $('submissionForm').reset();
    await loadDashboard();
  } catch(err) { showError(msg, err); }
});
$('refreshBtn').addEventListener('click', loadDashboard);
$('logoutBtn').addEventListener('click', logout);
async function logout() {
  const token = sessionToken; sessionToken = '';
  if (token) { try { await serverCall('logoutUser', token); } catch(e) {} }
  $('dashboardView').classList.add('hidden');
  $('authView').classList.remove('hidden');
  $('authMessage').textContent = '';
  $('submissionMessage').textContent = '';
  $('authForm').reset();
  setMode('login');
}
</script>
